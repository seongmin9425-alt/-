<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>K-관료제 업무 분류 게임</title>
    <!-- Tailwind CSS 연동 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts 연동 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
            touch-action: manipulation; /* 모바일 더블 탭 확대 방지 */
        }
        
        /* 결재 서류 느낌의 카드 스타일 */
        .document-card {
            background-color: #ffffff;
            background-image: 
                linear-gradient(#f0f0f0 1px, transparent 1px),
                linear-gradient(90deg, #f0f0f0 1px, transparent 1px);
            background-size: 20px 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        /* 도장(Stamp) 애니메이션 스타일 */
        .stamp {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg) scale(3);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: 900;
            border: 6px solid;
            border-radius: 12px;
            padding: 10px 24px;
            pointer-events: none; /* 클릭 방지 */
            font-size: 3rem;
            z-index: 10;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.7);
        }

        .stamp.show {
            transform: translate(-50%, -50%) rotate(-15deg) scale(1);
            opacity: 1;
        }

        /* 승인 (초록색) */
        .stamp.approve {
            color: #16a34a;
            border-color: #16a34a;
            background: rgba(255, 255, 255, 0.8);
        }

        /* 반려 (빨간색) */
        .stamp.reject {
            color: #dc2626;
            border-color: #dc2626;
            background: rgba(255, 255, 255, 0.8);
        }

        /* 부서 버튼 터치 효과 */
        .dept-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex justify-center items-center">

    <!-- 모바일 화면 비율을 위한 메인 컨테이너 -->
    <main class="w-full h-full max-w-md mx-auto bg-gray-50 flex flex-col relative shadow-2xl">
        
        <!-- 헤더 영역 -->
        <header class="bg-slate-800 text-white p-4 shadow-md text-center shrink-0 z-10">
            <h1 class="text-xl font-bold tracking-tight">K-관료제 업무 분류</h1>
            <div class="text-slate-300 text-sm mt-1" id="progress-text">남은 서류: 7/7</div>
        </header>

        <!-- 게임 진행 영역 -->
        <div id="game-screen" class="flex-1 flex flex-col justify-between p-4 overflow-hidden relative">
            
            <!-- 업무 카드 (결재 서류) -->
            <div class="flex-1 flex items-center justify-center relative p-2">
                <div class="document-card w-full h-full max-h-[300px] rounded-xl border border-gray-200 flex flex-col justify-center items-center p-6 text-center">
                    <div class="text-xs font-bold text-gray-400 mb-4 border-b-2 border-gray-300 pb-1 w-full text-left">기안서 / 업무요청</div>
                    <h2 id="task-text" class="text-2xl md:text-3xl font-bold text-gray-800 leading-tight word-keep-all">
                        <!-- 텍스트 주입됨 -->
                    </h2>
                    
                    <!-- 승인/반려 도장 -->
                    <div id="stamp" class="stamp">승인</div>
                </div>
            </div>

            <!-- 부서 선택 버튼 그리드 (모바일에 맞게 2개/3개 배치) -->
            <div class="mt-4 shrink-0 pointer-events-auto" id="button-container">
                <p class="text-center text-sm text-gray-500 mb-3 font-medium">이 업무를 담당할 부서를 선택하세요</p>
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <button onclick="handleSelection('인사팀')" class="dept-btn bg-white border-2 border-blue-200 text-blue-700 font-bold py-4 rounded-xl shadow-sm transition-colors hover:bg-blue-50 active:bg-blue-100">
                        👨‍💼 인사팀
                    </button>
                    <button onclick="handleSelection('총무팀')" class="dept-btn bg-white border-2 border-green-200 text-green-700 font-bold py-4 rounded-xl shadow-sm transition-colors hover:bg-green-50 active:bg-green-100">
                        🏢 총무팀
                    </button>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="handleSelection('재무팀')" class="dept-btn bg-white border-2 border-yellow-200 text-yellow-700 font-bold py-4 rounded-xl shadow-sm transition-colors hover:bg-yellow-50 active:bg-yellow-100">
                        💰 재무팀
                    </button>
                    <button onclick="handleSelection('법무팀')" class="dept-btn bg-white border-2 border-purple-200 text-purple-700 font-bold py-4 rounded-xl shadow-sm transition-colors hover:bg-purple-50 active:bg-purple-100">
                        ⚖️ 법무팀
                    </button>
                    <button onclick="handleSelection('IT지원팀')" class="dept-btn bg-white border-2 border-gray-300 text-gray-700 font-bold py-4 rounded-xl shadow-sm transition-colors hover:bg-gray-100 active:bg-gray-200 text-sm">
                        💻 IT지원
                    </button>
                </div>
            </div>
            
            <!-- 버튼 비활성화용 투명 오버레이 (도장 찍히는 동안) -->
            <div id="interaction-blocker" class="absolute inset-0 z-20 hidden"></div>
        </div>

        <!-- 결과 화면 (처음엔 숨김) -->
        <div id="result-screen" class="absolute inset-0 bg-slate-900 z-30 flex flex-col justify-center items-center text-white p-6 hidden">
            <h2 class="text-3xl font-bold mb-2">인사 평가 결과</h2>
            <div class="text-6xl font-black text-blue-400 mb-6" id="final-score">0 / 7</div>
            
            <div class="bg-slate-800 rounded-xl p-6 w-full text-center shadow-lg border border-slate-700">
                <p class="text-sm text-slate-400 mb-1">당신의 사내 계급은...</p>
                <h3 class="text-2xl font-bold text-yellow-400 mb-3" id="rank-title">차기 대표이사</h3>
                <p class="text-slate-300 leading-relaxed word-keep-all" id="rank-desc">
                    완벽한 사내 정치와 업무 파악 능력! 차기 대표이사는 따놓은 당상입니다.
                </p>
            </div>
            
            <button onclick="initGame()" class="mt-10 bg-white text-slate-900 font-bold text-lg py-4 px-8 rounded-full shadow-lg transition-transform hover:scale-105 active:scale-95 w-full max-w-xs">
                🔄 다시 출근하기
            </button>
        </div>
    </main>

    <script>
        // 업무 데이터 정의
        const ALL_TASKS = [
            { text: '신규 입사자 연봉 계약서 작성', correct: '인사팀' },
            { text: '사무실 복사기 토너 교체 및 A4용지 주문', correct: '총무팀' },
            { text: '타사와의 비밀유지계약서(NDA) 조항 검토', correct: '법무팀' },
            { text: '법인카드 사용 내역 정산 및 전표 처리', correct: '재무팀' },
            { text: '회의실 와이파이 연결 불량 및 PC 블루스크린 해결', correct: 'IT지원팀' },
            { text: '전 직원 명절 선물 세트 선정 및 택배 발송', correct: '총무팀' },
            { text: '직장 내 괴롭힘 관련 고충 상담', correct: '인사팀' }
        ];

        // 게임 상태 변수
        let currentTasks = [];
        let currentIndex = 0;
        let score = 0;
        let isProcessing = false;

        // DOM 요소 캐싱
        const taskTextEl = document.getElementById('task-text');
        const progressTextEl = document.getElementById('progress-text');
        const stampEl = document.getElementById('stamp');
        const blockerEl = document.getElementById('interaction-blocker');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        
        // 게임 초기화
        function initGame() {
            // 배열 깊은 복사 후 섞기 (원할 경우 섞음. 여기서는 고정으로 요청했으나 재미를 위해 섞음)
            // currentTasks = [...ALL_TASKS].sort(() => Math.random() - 0.5); 
            // 프롬프트 명세대로 순서대로 진행하려면 아래 활성화
            currentTasks = [...ALL_TASKS];
            
            currentIndex = 0;
            score = 0;
            isProcessing = false;

            // UI 초기화
            resultScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            
            updateUI();
        }

        // UI 업데이트 (새 업무 카드 표시)
        function updateUI() {
            if (currentIndex >= currentTasks.length) {
                showResult();
                return;
            }

            const task = currentTasks[currentIndex];
            taskTextEl.textContent = task.text;
            progressTextEl.textContent = `처리할 서류: ${currentIndex + 1} / ${currentTasks.length}`;
            
            // 도장 초기화
            stampEl.className = 'stamp';
            blockerEl.classList.add('hidden');
            isProcessing = false;
        }

        // 부서 버튼 클릭 처리
        function handleSelection(selectedDept) {
            if (isProcessing) return; // 연속 클릭 방지
            isProcessing = true;
            blockerEl.classList.remove('hidden'); // 클릭 차단 오버레이 활성화

            const task = currentTasks[currentIndex];
            const isCorrect = (selectedDept === task.correct) || (selectedDept === 'IT지원팀' && task.correct === 'IT지원팀'); // 텍스트 매칭 확인

            // 도장 효과 설정
            if (isCorrect) {
                stampEl.textContent = '승인';
                stampEl.className = 'stamp approve show';
                score++;
            } else {
                stampEl.textContent = '반려\n(타 부서)';
                stampEl.className = 'stamp reject show';
                stampEl.style.fontSize = '2rem'; // 반려일때는 글씨 살짝 작게
                stampEl.style.whiteSpace = 'pre-line'; // 줄바꿈 적용
            }

            // 1.5초 후 다음 서류로 이동
            setTimeout(() => {
                currentIndex++;
                updateUI();
            }, 1500);
        }

        // 결과 화면 표시
        function showResult() {
            gameScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            progressTextEl.textContent = "업무 종료";

            document.getElementById('final-score').textContent = `${score} / ${currentTasks.length}`;

            let title = "";
            let desc = "";

            if (score === 7) {
                title = "차기 대표이사 👑";
                desc = "완벽한 부서 간 R&R 파악 능력! 임원진의 신임을 한 몸에 받고 있습니다.";
            } else if (score >= 5) {
                title = "S급 에이스 🚀";
                desc = "어디 부서 소관인지 정확히 꿰뚫고 있군요! 동료들이 당신만 찾습니다.";
            } else if (score >= 3) {
                title = "무난한 대리 💼";
                desc = "가끔 타 부서에서 전화가 오긴 하지만, 평범하고 무난한 직장 생활 중입니다.";
            } else {
                title = "폐급 신입 💣";
                desc = "\"이거 저희 부서 일 아닌데요?\" 하루 종일 타 부서의 항의 전화를 받고 있습니다. 사유서를 준비하세요!";
            }

            document.getElementById('rank-title').textContent = title;
            document.getElementById('rank-desc').textContent = desc;
        }

        // 스크립트 로드 시 게임 시작
        window.onload = () => {
            initGame();
        };
    </script>
</body>
</html>
